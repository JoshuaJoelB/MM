<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1428" />
  <title>Match Monster</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/Level.css" />

  <link rel="icon" href="Assets/top_icon.png">
</head>
<body>

  <div id="levelPage" class="page active-page">
    <div class="level-bg">
      <div class="level-overlay">

        <header class="level-navbar">
          <a href="Subject.html" class="btn btn-back-top">
            <i class="fas fa-arrow-left"></i>
            <span class="btn-text">Subjects</span>
          </a>

          <h1 class="level-main-title" id="subjectMapTitle">Computer Map</h1>

          <div class="player-level-box point-box-floating">
            <div class="point-chip point-chip-star" title="Star Rating">
              <i class="fas fa-star"></i>
              <span data-nav-stars>0</span>
            </div>
            <div class="point-chip point-chip-coin" title="Points — used to unlock levels">
              <i class="fas fa-coins"></i>
              <span data-nav-points>0</span>
            </div>
          </div>
        </header>

        <div class="level-content">
          <div class="level-map" id="levelMap"></div>
        </div>

      </div>
    </div>
  </div>

  <script src="script/player-level.js"></script>
  <script src="script/platform-loader.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const urlParams = new URLSearchParams(window.location.search);
    const subject   = urlParams.get('subject') || 'computer';

    // ---- just_unlocked flag (only used for the jojoma walk animation) ----
    let justUnlockedLevel = null;
    try {
      const raw = sessionStorage.getItem('mm_just_unlocked');
      if (raw) {
        const data = JSON.parse(raw);
        if (data && data.subject === subject) justUnlockedLevel = data.level;
        sessionStorage.removeItem('mm_just_unlocked');
      }
    } catch (e) {}

    const subjectNames = { computer: 'Computer', science: 'Science', ap: 'AP' };
    const titleEl = document.getElementById('subjectMapTitle');
    if (titleEl) titleEl.textContent = (subjectNames[subject] || 'Subject') + ' Map';

    // ---- Storage helpers ----
    function getUnlocked() {
      try {
        const arr = JSON.parse(localStorage.getItem('matchMonster_unlocked_' + subject) || '[1]');
        return Array.isArray(arr) && arr.length ? arr : [1];
      } catch (e) { return [1]; }
    }
    function getCompleted() {
      try {
        const arr = JSON.parse(localStorage.getItem('matchMonster_completed_' + subject) || '[]');
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }
    function getBestStars(level) {
      try {
        const map = JSON.parse(localStorage.getItem('matchMonster_stars_' + subject) || '{}');
        return Number(map[level]) || 0;
      } catch (e) { return 0; }
    }

    function fadeAndNavigate(url) {
      let overlay = document.getElementById('sceneTransition');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'sceneTransition';
        document.body.appendChild(overlay);
        void overlay.offsetWidth;
      }
      overlay.classList.add('active');
      setTimeout(() => { window.location.href = url; }, 550);
    }

    const mapContainer = document.getElementById('levelMap');
    const totalLevels  = 10;

    const LEVEL_POSITIONS = [
      { x: 66, y: 85 }, { x: 56, y: 81 }, { x: 45, y: 78 }, { x: 36, y: 70 },
      { x: 50, y: 65 }, { x: 66, y: 55 }, { x: 48, y: 51 }, { x: 36, y: 44 },
      { x: 50, y: 38 }, { x: 60, y: 32 }
    ];

    function getCurrentLevelForPlayer(unlocked, completed, total) {
      for (let lvl = 1; lvl <= total; lvl++) {
        if (unlocked.includes(lvl) && !completed.includes(lvl)) return lvl;
      }
      for (let lvl = total; lvl >= 1; lvl--) {
        if (unlocked.includes(lvl)) return lvl;
      }
      return 1;
    }

    // ================================================================
    // RENDER
    // ================================================================
    function renderMap() {
      const jojo = mapContainer.querySelector('.jojoma-character');

      // Remove all children except jojoma
      Array.from(mapContainer.children).forEach(child => {
        if (child !== jojo) child.remove();
      });

      // Background island
      const bgImg = document.createElement('img');
      bgImg.src = 'Assets/Platform_Island.png';
      bgImg.alt = '';
      bgImg.className = 'level-map-bg';
      bgImg.draggable = false;
      mapContainer.appendChild(bgImg);

      const unlocked  = getUnlocked();
      const completed = getCompleted();

      // ---- Level markers ----
      LEVEL_POSITIONS.forEach((pos, i) => {
        const level       = i + 1;
        const isUnlocked  = unlocked.includes(level);
        const isCompleted = completed.includes(level);
        const stars       = getBestStars(level);

        const island = document.createElement('div');
        island.className = 'island-item';
        island.style.left = pos.x + '%';
        island.style.top  = pos.y + '%';
        island.dataset.level = level;

        if (level === 1)  island.classList.add('start-island');
        if (level === 10) island.classList.add('end-island');
        if (isUnlocked && isCompleted) island.classList.add('is-completed');
        if (!isUnlocked) island.classList.add('is-locked');

        const link = document.createElement('a');
        link.className = 'island-link';

        if (isUnlocked) {
          link.href = `Gameplay/Gameplay-${subject}.html?level=${level}&subject=${subject}`;
          link.addEventListener('click', function (e) {
            e.preventDefault();
            fadeAndNavigate(this.href);
          });
        } else {
          link.href = 'javascript:void(0)';
          link.addEventListener('click', function (e) {
            e.preventDefault();
            handleUnlockClick(level);
          });
        }

        // Level number
        const number = document.createElement('span');
        number.className = 'island-number';
        number.textContent = level;
        link.appendChild(number);

        // Star rating row (on bottom curve of the pill)
        const starsRow = document.createElement('div');
        starsRow.className = 'island-stars';
        for (let s = 1; s <= 3; s++) {
          const star = document.createElement('i');
          star.className = 'fas fa-star' + (s <= stars ? ' filled' : '');
          starsRow.appendChild(star);
        }
        link.appendChild(starsRow);

        island.appendChild(link);
        mapContainer.appendChild(island);
      });

      // ---- Jojo positioning ----
      const currentLevel = getCurrentLevelForPlayer(unlocked, completed, totalLevels);
      const targetPos = LEVEL_POSITIONS[currentLevel - 1];

      if (jojo) {
        if (targetPos) {
          jojo.style.left = targetPos.x + '%';
          jojo.style.top  = targetPos.y + '%';
          jojo.dataset.level = currentLevel;
        }
      } else if (targetPos) {
        const jojoEl = document.createElement('img');
        jojoEl.src = 'Assets/jojoma.png';
        jojoEl.alt = '';
        jojoEl.className = 'jojoma-character';
        jojoEl.draggable = false;
        jojoEl.dataset.level = currentLevel;
        jojoEl.style.left = targetPos.x + '%';
        jojoEl.style.top  = targetPos.y + '%';
        mapContainer.appendChild(jojoEl);
      }
    }

    // ================================================================
    // UNLOCK CLICK
    // ================================================================
    function handleUnlockClick(level) {
      if (typeof window.tryUnlockLevel !== 'function') {
        alert('System not ready. Please refresh the page.');
        return;
      }

      const result = window.tryUnlockLevel(subject, level);

      if (result.ok) {
        // localStorage is already saved inside tryUnlockLevel (with read-back verification)

        // Re-render the whole map so the new unlock state is shown
        renderMap();

        // Highlight the newly unlocked level briefly
        const marker = mapContainer.querySelector(`.island-item[data-level="${level}"]`);
        if (marker) {
          marker.classList.add('just-unlocked');
          setTimeout(() => marker.classList.remove('just-unlocked'), 1600);
        }

        // Walk jojoma to the newly unlocked level
        const jojo = mapContainer.querySelector('.jojoma-character');
        const pos  = LEVEL_POSITIONS[level - 1];
        if (jojo && pos) {
          jojo.style.left = pos.x + '%';
          jojo.style.top  = pos.y + '%';
          jojo.dataset.level = level;
        }

        // Do NOT navigate away — the user can now click the level to play it.
        return;
      }

      // ---- Failure messages ----
      if (result.reason === 'not_enough_points') {
        alert(
          `⭐ Not enough points!\n\n` +
          `Level ${level} costs ${result.cost} points.\n` +
          `You have ${result.points} points.\n\n` +
          `Play more levels to earn points!`
        );
      } else if (result.reason === 'previous_not_completed') {
        alert(
          `Finish Level ${level - 1} first!\n\n` +
          `You need to complete the previous level before unlocking Level ${level}.`
        );
      } else if (result.reason === 'previous_locked') {
        alert(`Complete the previous level first!`);
      } else if (result.reason === 'save_failed') {
        alert(`Could not save your progress. Please try again.`);
      } else {
        alert(`Could not unlock Level ${level}. Please try again.`);
      }
    }

    // ================================================================
    // BOOT
    // ================================================================
    function bootMap() {
      renderMap();

      // If we just arrived back from unlocking in Gameplay, animate jojoma
      if (justUnlockedLevel) {
        const targetLevel = justUnlockedLevel;
        justUnlockedLevel = null;

        setTimeout(() => {
          const pos    = LEVEL_POSITIONS[targetLevel - 1];
          const jojo   = mapContainer.querySelector('.jojoma-character');
          const marker = mapContainer.querySelector(`.island-item[data-level="${targetLevel}"]`);

          if (marker) {
            marker.classList.add('just-unlocked');
            setTimeout(() => marker.classList.remove('just-unlocked'), 1600);
          }
          if (jojo && pos) {
            jojo.style.left = pos.x + '%';
            jojo.style.top  = pos.y + '%';
            jojo.dataset.level = targetLevel;
          }
        }, 400);
      }

      // Re-render on focus/page-show (fresh state from localStorage)
      window.addEventListener('pageshow', function () { renderMap(); });
      window.addEventListener('focus',    function () { renderMap(); });
    }

    if (window.platformReadyPromise) {
      window.platformReadyPromise.then(bootMap);
    } else {
      bootMap();
    }
  });
  </script>

  <script src="script/cloud-loader.js"></script>
  <script src="script/clouds.js"></script>

</body>
</html>
