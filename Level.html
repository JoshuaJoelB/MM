<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1428" />
  <title>Match Monster</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/Level.css" />

  <link rel="icon" href="Assets/top_icon.png">
</head>
<body>

  <div id="levelPage" class="page active-page">
    <div class="level-bg">
      <div class="level-overlay">

        <!-- NAVBAR: back button | title | point chips -->
        <header class="level-navbar">
          <a href="Subject.html" class="btn btn-back-top">
            <i class="fas fa-arrow-left"></i>
            <span class="btn-text">Subjects</span>
          </a>

          <h1 class="level-main-title" id="subjectMapTitle">Computer Map</h1>

          <div class="player-level-box point-box-floating">
            <div class="point-chip point-chip-star" title="Star Rating (best per level)">
              <i class="fas fa-star"></i>
              <span data-nav-stars>0</span>
            </div>
            <div class="point-chip point-chip-coin" title="Coins — used to unlock levels">
              <i class="fas fa-coins"></i>
              <span data-nav-coins>0</span>
            </div>
          </div>
        </header>

        <!-- MAP CONTENT -->
        <div class="level-content">
          <div class="level-map" id="levelMap">
            <!-- Level markers + Jojoma character injected by JavaScript -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script/player-level.js"></script>
  <script src="script/platform-loader.js"></script>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const urlParams = new URLSearchParams(window.location.search);
    const subject   = urlParams.get('subject') || 'computer';

    // ----- READ "just unlocked" FLAG -----
    let justUnlockedLevel = null;
    try {
      const raw = sessionStorage.getItem('mm_just_unlocked');
      if (raw) {
        const data = JSON.parse(raw);
        if (data && data.subject === subject) justUnlockedLevel = data.level;
        sessionStorage.removeItem('mm_just_unlocked');
      }
    } catch (e) {}

    const subjectNames = {
      computer: 'Computer',
      science:  'Science',
      ap:       'AP'
    };

    document.getElementById('subjectMapTitle').textContent =
      (subjectNames[subject] || 'Subject') + ' Map';

    // ----- STORAGE HELPERS -----
    function getUnlocked() {
      try {
        const arr = JSON.parse(localStorage.getItem('matchMonster_unlocked_' + subject) || '[1]');
        return Array.isArray(arr) ? arr : [1];
      } catch (e) { return [1]; }
    }
    function getCompleted() {
      try {
        const arr = JSON.parse(localStorage.getItem('matchMonster_completed_' + subject) || '[]');
        return Array.isArray(arr) ? arr : [];
      } catch (e) { return []; }
    }
    // NEW: read best star rating per level
    function getBestStars(level) {
      try {
        const data = JSON.parse(localStorage.getItem('matchMonster_stars_' + subject) || '{}');
        return Number(data[level]) || 0;
      } catch (e) { return 0; }
    }

    // ----- SMOOTH SCENE TRANSITION -----
    function fadeAndNavigate(url) {
      let overlay = document.getElementById('sceneTransition');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'sceneTransition';
        document.body.appendChild(overlay);
        void overlay.offsetWidth;
      }
      overlay.classList.add('active');
      setTimeout(() => { window.location.href = url; }, 550);
    }

    // ----- LEVEL POSITIONS -----
    const mapContainer = document.getElementById('levelMap');
    const totalLevels  = 10;

    const LEVEL_POSITIONS = [
      { x: 66, y: 85 },  // 1
      { x: 56, y: 81 },  // 2
      { x: 45, y: 78 },  // 3
      { x: 36, y: 70 },  // 4
      { x: 50, y: 65 },  // 5
      { x: 66, y: 55 },  // 6
      { x: 48, y: 51 },  // 7
      { x: 36, y: 44 },  // 8
      { x: 50, y: 38 },  // 9
      { x: 60, y: 32 }   // 10
    ];

    function getCurrentLevelForPlayer(unlocked, completed, total) {
      for (let lvl = 1; lvl <= total; lvl++) {
        if (unlocked.includes(lvl) && !completed.includes(lvl)) return lvl;
      }
      return total;
    }

    // ================================================================
    // RENDER
    // ================================================================
    function renderMap() {
      const jojo = mapContainer.querySelector('.jojoma-character');

      Array.from(mapContainer.children).forEach(child => {
        if (child !== jojo) child.remove();
      });

      // Background island image
      const bgImg = document.createElement('img');
      bgImg.src = 'Assets/Platform_Island.png';
      bgImg.alt = '';
      bgImg.className = 'level-map-bg';
      bgImg.draggable = false;
      mapContainer.appendChild(bgImg);

      const unlockedLevels  = getUnlocked();
      const completedLevels = getCompleted();

      // ---- Level markers ----
      LEVEL_POSITIONS.forEach((pos, i) => {
        const level       = i + 1;
        const isUnlocked  = unlockedLevels.includes(level);
        const isCompleted = completedLevels.includes(level);
        const bestStars   = getBestStars(level);

        const island = document.createElement('div');
        island.className = 'island-item';
        island.style.left = pos.x + '%';
        island.style.top  = pos.y + '%';
        island.dataset.level = level;

        if (level === 1)  island.classList.add('start-island');
        if (level === 10) island.classList.add('end-island');
        if (isUnlocked && isCompleted) island.classList.add('is-completed');
        if (!isUnlocked) island.classList.add('is-locked');

        const link = document.createElement('a');
        link.className = 'island-link';

        if (isUnlocked) {
          link.href = `Gameplay/Gameplay-${subject}.html?level=${level}&subject=${subject}`;
          link.addEventListener('click', function (e) {
            e.preventDefault();
            fadeAndNavigate(this.href);
          });
        } else {
          link.href = 'javascript:void(0)';
        }

        // Number
        const number = document.createElement('span');
        number.className = 'island-number';
        number.textContent = level;
        link.appendChild(number);

        island.appendChild(link);

        // ----------------------------------------------------------
        // 3-STAR RATING ROW
        // Show stars if level has been played (bestStars > 0) OR if it's
        // the start level (so kids see the goal). Locked & unplayed
        // levels show empty stars so the target is always visible.
        // ----------------------------------------------------------
               // ----------------------------------------------------------
        // 3-STAR RATING ROW — sits on the bottom curve of the pill
        // ----------------------------------------------------------
        const starsRow = document.createElement('div');
        starsRow.className = 'island-stars';

        const showStars = bestStars > 0 || isCompleted || isUnlocked;
        if (showStars) {
          for (let s = 1; s <= 3; s++) {
            const star = document.createElement('i');
            star.className = 'fas fa-star' + (s <= bestStars ? ' filled' : '');
            starsRow.appendChild(star);
          }
          // Append INSIDE the link so we can position it against the pill
          link.appendChild(starsRow);
        }
        // Locked click → try to unlock (costs COINS)
        if (!isUnlocked) {
          link.addEventListener('click', function (e) {
            e.preventDefault();
            if (typeof window.tryUnlockLevel !== 'function') return;
            const result = window.tryUnlockLevel(subject, level);

            if (result.ok) {
              justUnlockedLevel = level;
              renderMap();
              if (typeof window.updatePlayerLevelBox === 'function') {
                window.updatePlayerLevelBox();
              }
            } else if (result.reason === 'not_enough_coins') {
              alert(
                `🪙 Not enough coins!\n\n` +
                `Level ${level} costs ${result.cost} coins.\n` +
                `You have ${result.coins} coins.\n\n` +
                `Play more levels to earn coins!`
              );
            } else if (result.reason === 'not_enough_stars') {
              // fallback for legacy reason name
              alert(
                `⭐ Not enough coins!\n\n` +
                `Level ${level} costs ${result.cost}.\n` +
                `You have ${result.stars}.\n\n` +
                `Play more levels to earn more!`
              );
            } else if (result.reason === 'previous_locked') {
              alert(`Complete the previous level first!`);
            }
          });
        }

        mapContainer.appendChild(island);
      });

      // ================================================================
      // JOJOMA
      // ================================================================
      const currentLevel = getCurrentLevelForPlayer(
        unlockedLevels, completedLevels, totalLevels
      );
      const targetPos = LEVEL_POSITIONS[currentLevel - 1];

      const shouldAnimateUnlock =
        justUnlockedLevel === currentLevel && currentLevel > 1;
      const startLevelForJojo = shouldAnimateUnlock ? currentLevel - 1 : currentLevel;
      const startPos = LEVEL_POSITIONS[startLevelForJojo - 1];

      if (jojo) {
        if (targetPos) {
          jojo.style.left = targetPos.x + '%';
          jojo.style.top  = targetPos.y + '%';
          jojo.dataset.level = currentLevel;
        }
      } else if (targetPos) {
        const jojoEl = document.createElement('img');
        jojoEl.src = 'Assets/jojoma.png';
        jojoEl.alt = '';
        jojoEl.className = 'jojoma-character';
        jojoEl.draggable = false;
        jojoEl.dataset.level = startLevelForJojo;

        const initialPos = shouldAnimateUnlock ? startPos : targetPos;
        jojoEl.style.left = initialPos.x + '%';
        jojoEl.style.top  = initialPos.y + '%';
        mapContainer.appendChild(jojoEl);

        if (shouldAnimateUnlock) {
          setTimeout(() => {
            const targetMarker = mapContainer.querySelector(
              `.island-item[data-level="${currentLevel}"]`
            );
            if (targetMarker) {
              targetMarker.classList.add('just-unlocked');
              setTimeout(() => targetMarker.classList.remove('just-unlocked'), 1600);
            }

            jojoEl.style.left = targetPos.x + '%';
            jojoEl.style.top  = targetPos.y + '%';
            jojoEl.dataset.level = currentLevel;

            setTimeout(() => {
              fadeAndNavigate(
                `Gameplay/Gameplay-${subject}.html?level=${currentLevel}&subject=${subject}`
              );
            }, 1400);
          }, 400);

          justUnlockedLevel = null;
        }
      }
    }

    // ---- Boot ----
    function bootMap() {
      renderMap();
      window.addEventListener('pageshow', renderMap);
      window.addEventListener('focus',    renderMap);
    }

    if (window.platformReadyPromise) {
      window.platformReadyPromise.then(bootMap);
    } else {
      bootMap();
    }
  });
  </script>

  <script src="script/cloud-loader.js"></script>
  <script src="script/clouds.js"></script>

</body>
</html>
