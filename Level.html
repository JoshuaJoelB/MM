<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Keania+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style/style.css" />
  <link rel="stylesheet" href="style/Level.css" />
  <link rel="icon" href="Assets/top_icon.png">
</head>
<body>

  <div id="levelPage" class="page active-page">
    <div class="level-bg">
      <div class="level-overlay">

        <a href="Subject.html" class="btn btn-back-top">
          <i class="fas fa-arrow-left me-2"></i> Subjects
        </a>

        <div class="level-content text-center">
          <h1 class="level-main-title">Island Map</h1>
          <p class="level-tagline" id="subjectDisplay">Select a level to start</p>

          <div class="level-map" id="levelMap">
            <!-- Levels will be injected by JavaScript -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const urlParams = new URLSearchParams(window.location.search);
      const subject = urlParams.get('subject') || 'computer';

      const subjectNames = {
        computer: 'Computer Science',
        science: 'Science',
        ap: 'AP'
      };
      document.getElementById('subjectDisplay').textContent = subjectNames[subject] || 'Select a level';

      // ----- PROGRESSION: get unlocked levels from localStorage -----
      const storageKey = `matchMonster_unlocked_${subject}`;
      let unlockedLevels = JSON.parse(localStorage.getItem(storageKey)) || [1];
      
      if (!unlockedLevels.includes(1)) {
        unlockedLevels.push(1);
        localStorage.setItem(storageKey, JSON.stringify(unlockedLevels));
      }

      const completedKey = `matchMonster_completed_${subject}`;
      let completedLevels = JSON.parse(localStorage.getItem(completedKey)) || [];

      // ----- Build the map -----
      const mapContainer = document.getElementById('levelMap');
      const totalLevels = 10;

      const row1 = [1, 2, 3, 4, 5];
      const row2 = [10, 9, 8, 7, 6];
      const allLevels = [...row1, ...row2];

      const row1Wrapper = document.createElement('div');
      row1Wrapper.className = 'map-row';
      const row2Wrapper = document.createElement('div');
      row2Wrapper.className = 'map-row';

      allLevels.forEach((level, index) => {
        const island = document.createElement('div');
        island.className = 'island-item';
        if (level === 1) island.classList.add('start-island');
        if (level === 10) island.classList.add('end-island');

        const isUnlocked = unlockedLevels.includes(level);
        const isCompleted = completedLevels.includes(level);

        const link = document.createElement('a');
        if (isUnlocked) {
          link.href = `Gameplay/Gameplay-${subject}.html?level=${level}`;
          link.className = 'island-link';
        } else {
          link.href = '#';
          link.className = 'island-link locked';
          link.style.cursor = 'not-allowed';
          link.style.opacity = '0.4';
          link.style.filter = 'grayscale(0.8)';
          link.style.pointerEvents = 'none';
        }

        // Lock icon for locked levels
        if (!isUnlocked) {
          const lockIcon = document.createElement('span');
          lockIcon.className = 'island-lock';
          lockIcon.textContent = '🔒';
          lockIcon.style.cssText = `
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 1.2rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
          `;
          island.appendChild(lockIcon);
        }

        // ✅ GREEN COMPLETION – no checkmark icon, just green styling
        if (isCompleted && isUnlocked) {
          // Make the island green
          link.style.borderColor = '#4ade80';
          link.style.boxShadow = '0 0 30px rgba(74, 222, 128, 0.4), inset 0 0 20px rgba(74, 222, 128, 0.1)';
          link.style.background = 'radial-gradient(circle at 30% 30%, #1a4a2a, #0a2a1a)';
          // Green number
          const numSpan = link.querySelector('.island-number');
          if (numSpan) numSpan.style.color = '#4ade80';
          // Optional: add a subtle green glow to the island container
          island.style.filter = 'drop-shadow(0 0 20px rgba(74, 222, 128, 0.2))';
        }

        const number = document.createElement('span');
        number.className = 'island-number';
        number.textContent = level;

        const label = document.createElement('span');
        label.className = 'island-label';
        label.textContent = `Level ${level}`;

        link.appendChild(number);
        link.appendChild(label);
        island.appendChild(link);

        // Add bridges
        if (index < row1.length - 1 && level < 5) {
          const bridge = document.createElement('div');
          bridge.className = 'bridge-horizontal';
          island.appendChild(bridge);
        }
        if (index === row1.length - 1) {
          const bridgeV = document.createElement('div');
          bridgeV.className = 'bridge-vertical';
          island.appendChild(bridgeV);
        }
        if (index >= row1.length && index < allLevels.length - 1) {
          const bridge = document.createElement('div');
          bridge.className = 'bridge-horizontal';
          island.appendChild(bridge);
        }

        if (index < row1.length) {
          row1Wrapper.appendChild(island);
        } else {
          row2Wrapper.appendChild(island);
        }
      });

      mapContainer.appendChild(row1Wrapper);
      mapContainer.appendChild(row2Wrapper);

      // ----- Progress info -----
      const progressInfo = document.createElement('p');
      progressInfo.className = 'progress-info mt-3';
      progressInfo.style.cssText = `
        font-family: 'Irish Grover', cursive;
        color: rgba(196, 181, 253, 0.4);
        font-size: 0.85rem;
        letter-spacing: 2px;
      `;
      const completedCount = completedLevels.length;
      progressInfo.textContent = `🏆 ${completedCount} / ${totalLevels} levels completed`;
      document.querySelector('.level-content').appendChild(progressInfo);

    });
  </script>
</body>
</html>
