<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster</title>
  <link rel="icon" href="../Assets/top_icon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Keania+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style/style.css" />
  <link rel="icon"  href="Assets/top_icon.png">
</head>
<body>

  <div id="gameplayPage" class="page active-page">
    <div class="home-bg">
      <div class="home-overlay gameplay-overlay">

        <div class="gameplay-header w-100">
          <div class="gameplay-nav">
            <a href="../Level.html?subject=ap" class="btn btn-back-top">
              <i class="fas fa-arrow-left me-2"></i> Levels
            </a>
            <h1 class="gameplay-title">📚 AP</h1>
            <div class="gameplay-info">
              <span>Level: <strong id="levelDisplay">1</strong></span>
              <span>Moves: <strong id="movesDisplay">0</strong></span>
              <span>Time: <strong id="timerDisplay">0s</strong></span>
            </div>
          </div>
        </div>

        <div class="gameplay-board">
          <div class="card-grid" id="cardGrid"></div>
        </div>

        <!-- WIN OVERLAY -->
        <div id="winOverlay" class="win-overlay">
        <div class="win-box">
            <span class="win-icon">🏆</span>
            <h2>Level Complete!</h2>
            <p>You matched all the cards!</p>
            <div class="win-stats">
            <div>
                <span class="num" id="winMoves">0</span>
                <span class="label">Moves</span>
            </div>
            <div>
                <span class="num" id="winTime">0s</span>
                <span class="label">Time</span>
            </div>
            <div>
                <span class="num">⭐</span>
                <span class="label">Reward</span>
            </div>
            </div>
            <div class="win-buttons">
            <button class="btn-win-home" id="btnLevels">
                <i class="fas fa-map me-1"></i> Levels
            </button>
            <button class="btn-win-play" id="btnNextLevel">
                Next Level <i class="fas fa-arrow-right ms-1"></i>
            </button>
            </div>
        </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../script/gameplay.js"></script>
</body>
</html>
