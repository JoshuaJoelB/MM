<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster · Computer Science</title>
  <link rel="icon" href="../Assets/top_icon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Keania+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style/style.css" />
</head>
<body>

  <div id="gameplayPage" class="page active-page">
    <div class="home-bg">
      <div class="home-overlay gameplay-overlay">

        <div class="gameplay-header w-100">
          <div class="gameplay-nav">
            <a href="../Level.html?subject=computer" class="btn btn-back-top">
              <i class="fas fa-arrow-left me-2"></i> Levels
            </a>
            <h1 class="gameplay-title">💻 Computer Science</h1>
            <div class="gameplay-info">
              <span>Level: <strong id="levelDisplay">1</strong></span>
              <span>Moves: <strong id="movesDisplay">0</strong></span>
              <span>Time: <strong id="timerDisplay">0s</strong></span>
            </div>
          </div>
        </div>

        <div class="gameplay-board">
          <div class="card-grid" id="cardGrid"></div>
        </div>

        <div id="winOverlay" class="win-overlay">
          <div class="win-box">
            <div class="win-icon">🏆</div>
            <h2>Level Complete!</h2>
            <p>You matched all the cards!</p>
            <div class="win-stats">
              <div>
                <div class="num" id="winMoves">0</div>
                <div class="label">Moves</div>
              </div>
              <div>
                <div class="num" id="winTime">0s</div>
                <div class="label">Time</div>
              </div>
              <div>
                <div class="num">⭐</div>
                <div class="label">Reward</div>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
              <button class="btn-win-play" id="btnReplay">
                <i class="fas fa-redo me-2"></i> Replay
              </button>
              <button class="btn-win-home" id="btnLevels">
                <i class="fas fa-map me-2"></i> Levels
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="../script/gameplay.js"></script>
</body>
</html>
