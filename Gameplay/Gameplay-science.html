<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Keania+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../style/style.css" />
  <link rel="icon" href="../Assets/top_icon.png" />
</head>
<body>

  <div id="gameplayPage" class="page active-page">
    <div class="home-bg">
      <div class="gameplay-overlay">

        <!-- ============ NAVBAR ============ -->
        <header class="gameplay-navbar">
          <div class="gameplay-navbar-inner">

            <a href="../Level.html?subject=science" class="btn-back-circle" aria-label="Back to levels">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1a0f2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </a>

            <div class="gameplay-timer" id="timerDisplay">02:00</div>

            <div class="gameplay-right">
              <span class="gameplay-level">LEVEL <strong id="levelDisplay">1</strong></span>
              <button type="button" class="btn-pause-circle" id="btnPause" aria-label="Pause">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#1a0f2e">
                  <rect x="6"  y="5" width="4" height="14" rx="1.5"></rect>
                  <rect x="14" y="5" width="4" height="14" rx="1.5"></rect>
                </svg>
              </button>
            </div>

          </div>
        </header>

        <!-- ============ SUBHEADER ============ -->
        <div class="gameplay-subheader">
          <h2 class="gameplay-subject-title">Science</h2>

          <div class="star-progress" id="starProgress">
            <div class="star-progress-track">
              <div class="star-progress-fill" id="starProgressFill"></div>
            </div>
            <div class="star-progress-stars">
              <i class="fas fa-star" data-milestone="1"></i>
              <i class="fas fa-star" data-milestone="2"></i>
              <i class="fas fa-star" data-milestone="3"></i>
            </div>
          </div>
        </div>

        <!-- GAME BOARD -->
        <main class="gameplay-board">
          <div class="card-grid" id="cardGrid"></div>
        </main>

        <!-- PAUSE OVERLAY -->
        <div id="pauseOverlay" class="pause-overlay">
          <div class="pause-box">
            <h2 class="pause-heading">Paused</h2>
            <p class="pause-text">Take a break!</p>

            <div class="pause-buttons">
              <button class="btn-pause-levels" id="btnPauseLevels">
                <i class="fas fa-map me-1"></i> Levels
              </button>
              <button class="btn-pause-resume" id="btnPauseResume">
                <i class="fas fa-play me-1"></i> Resume
              </button>
            </div>
          </div>
        </div>

        <!-- WIN OVERLAY -->
        <div id="winOverlay" class="win-overlay">
          <div class="win-box">
            <span class="win-icon">🏆</span>
            <h2>Level Complete!</h2>
            <p>You matched all the cards!</p>

            <div class="win-stats">
              <div><span class="num" id="winMoves">0</span><span class="label">Moves</span></div>
              <div><span class="num" id="winTime">0s</span><span class="label">Time</span></div>
            </div>

            <div class="win-rewards-title">Your Points</div>
            <div class="win-rewards">
              <div class="win-reward-item win-reward-star">
                <i class="fas fa-star"></i>
                <span class="win-reward-value" id="winStarsEarned">+0</span>
                <span class="win-reward-label">Stars</span>
              </div>
              <div class="win-reward-item win-reward-coin">
                <i class="fas fa-coins"></i>
                <span class="win-reward-value" id="winCoinsEarned">+0</span>
                <span class="win-reward-label">Points</span>
              </div>
            </div>

            <div class="win-buttons">
              <button class="btn-win-home btn-win-levels" id="btnLevels">
                <i class="fas fa-map me-1"></i> Levels
              </button>

              <div class="win-buttons-row">
                <button class="btn-win-restart" id="btnRestartLevel">
                  <i class="fas fa-redo me-1"></i> Restart
                </button>
                <button class="btn-win-play" id="btnNextLevel">
                  Next Level <i class="fas fa-arrow-right ms-1"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- LOSE OVERLAY -->
        <div id="loseOverlay" class="win-overlay lose-overlay">
          <div class="win-box lose-box">
            <span class="win-icon lose-icon">⏰</span>
            <h2 class="lose-heading">Time's Up!</h2>
            <p class="lose-text">You ran out of time!</p>

            <div class="lose-time-hero">
              <span class="lose-time-value" id="loseTime">00:00</span>
              <span class="lose-time-label">Time</span>
            </div>

            <div class="win-stats">
              <div>
                <span class="num" id="loseMoves">0</span>
                <span class="label">Moves</span>
              </div>
              <div>
                <span class="num" id="losePairs">0 / 0</span>
                <span class="label">Pairs</span>
              </div>
            </div>

            <div class="win-buttons">
              <button class="btn-win-home btn-win-levels" id="btnLoseLevels">
                <i class="fas fa-map me-1"></i> Levels
              </button>

              <div class="win-buttons-row">
                <button class="btn-win-restart" id="btnLoseRetry">
                  <i class="fas fa-redo me-1"></i> Try Again
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

<script src="../script/player.js"></script>
<script src="../script/leaderboard-data.js"></script>
<script src="../script/leaderboard.js"></script>
<script src="../script/player-level.js"></script>
<script src="../script/audio.js"></script>
<script src="../script/sfx.js"></script>

<!-- ⬇️ NEW: preloads all card images for this level -->
<script src="../script/asset-loader.js"></script>

<script src="../script/gameplay.js"></script>
<script src="../script/cloud-loader.js"></script>
<script src="../script/clouds.js"></script>
<script src="../script/island.js"></script>
</body>
</html>
