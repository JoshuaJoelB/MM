<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Keania+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style/style.css" />
  <link rel="icon" href="Assets/top_icon.png">

  <!-- ============================================================
       SUBJECT CARDS — full-image buttons
       ============================================================ -->
  <style>
    /* Widen the grid so the wide cards have room */
    .subject-content { max-width: 720px; }

    .subject-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-top: 18px;
    }

    /* The <a> is the button — remove padding/border so the image IS the card */
    .subject-card {
      padding: 0 !important;
      border: 3px solid rgba(255, 215, 0, 0.55) !important;
      border-radius: 22px !important;
      overflow: hidden;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4),
        0 0 30px rgba(255, 215, 0, 0.2);
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
      display: block;
      line-height: 0;
    }

    .subject-card-img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform 0.3s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Hover / focus states */
    .subject-card:hover,
    .subject-card:focus-visible {
      transform: translateY(-6px);
      border-color: #FFD700 !important;
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.5),
        0 0 50px rgba(255, 215, 0, 0.55);
      outline: none;
    }

    .subject-card:hover .subject-card-img,
    .subject-card:focus-visible .subject-card-img {
      transform: scale(1.02);
    }

    .subject-card:active {
      transform: translateY(-2px) scale(0.99);
    }

    /* Tablet / desktop — 3 across */
    @media (min-width: 768px) {
      .subject-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .subject-content { max-width: 1000px; }
    }

    @media (max-width: 480px) {
      .subject-card { border-radius: 18px !important; }
      .subject-grid { gap: 16px; }
    }
  </style>
</head>
<body>

  <div id="subjectPage" class="page active-page">
    <div class="home-bg">
      <div class="home-overlay subject-overlay">

        <!-- Back to Home -->
        <a href="Home.html" class="btn btn-back-top">
          <i class="fas fa-arrow-left me-2"></i> Home
        </a>

        <div class="subject-content text-center">
          <h1 class="subject-main-title">Choose Your Subject</h1>
          <p class="subject-tagline">pick a topic to start matching</p>

          <div class="subject-grid">
            <!-- EPP / Computer -->
            <a href="Level.html?subject=computer"
               class="subject-card"
               aria-label="Play Computer / EPP">
              <img
                src="Assets/icons/rc_epp.png"
                alt="Computer / EPP"
                class="subject-card-img"
                draggable="false"
              />
            </a>

            <!-- Science -->
            <a href="Level.html?subject=science"
               class="subject-card"
               aria-label="Play Science">
              <img
                src="Assets/icons/rc_science.png"
                alt="Science"
                class="subject-card-img"
                draggable="false"
              />
            </a>

            <!-- AP -->
            <a href="Level.html?subject=ap"
               class="subject-card"
               aria-label="Play AP">
              <img
                src="Assets/icons/rc_ap.png"
                alt="AP"
                class="subject-card-img"
                draggable="false"
              />
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script/asset-loader.js"></script>
  <script src="script/script.js"></script>
  <script src="script/cloud-loader.js"></script>
  <script src="script/clouds.js"></script>
  <script src="script/island.js"></script>
  <script src="script/audio.js"></script>
  <script src="script/sfx.js"></script>

</body>
</html>
