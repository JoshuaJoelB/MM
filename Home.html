<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1428" />
  <meta name="description" content="Match Monster — a fun memory card game for kids." />
  <title>Match Monster</title>

  <!-- FAVICON -->
  <link rel="icon" href="Assets/top_icon.png" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet" />

  <!-- DynaPuff font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Custom styles -->
  <link rel="stylesheet" href="style/style.css" />
</head>
<body>

  <!-- Clouds + Islands layer (fixed, behind the page, above the sky) -->
  <div id="cloudLayer"></div>

  <div id="homePage" class="page active-page">
    <div class="home-bg">
      <div class="home-overlay">

        <!-- NAVBAR (loaded from navbar.html by navbar-loader.js) -->
        <div id="navbarContainer"></div>

        <!-- HOME LOBBY -->
        <div id="homeLobby" class="home-lobby">

          <!-- TITLE -->
          <div class="home-title-content text-center">
            <h1 class="home-main-title">Match</h1>
            <h2 class="home-sub-title">Monsters</h2>
          </div>

          <!-- MAIN CTA -->
          <a href="Subject.html" class="btn-start-game" id="chooseSubjectBtn">
            Play Now
          </a>

        </div>
        <!-- /HOME LOBBY -->

      </div>
    </div>
  </div>
  <!-- /homePage -->

  <!-- Scripts -->

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Player level + points (must load before navbar-loader) -->
  <script src="script/player-level.js"></script>

  <!-- Navbar injector -->
  <script src="script/navbar-loader.js"></script>

  <!-- Home page logic -->
  <script src="script/script.js"></script>

  <!-- Clouds -->
  <script src="script/cloud-loader.js"></script>
  <script src="script/clouds.js"></script>

  <!-- Islands (sit between back and front clouds) -->
  <script src="script/island.js"></script>

</body>
</html>
