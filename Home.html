<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster</title>
  <link rel="icon" href="Assets/top_icon.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Keania+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style/style.css" />
</head>
<body>

  <div id="homePage" class="page active-page">
    <div class="home-bg">
      <div class="home-overlay">

        <!-- ✅ NAVBAR (loaded from navbar.html) -->
        <div id="navbarContainer"></div>

        <!-- LOBBY -->
        <div id="homeLobby" class="home-lobby">
          <div class="home-title-content text-center">
            <div class="home-character-wrapper">
              <span class="home-character">
                <img src="Assets/mlb.gif" alt="Animated monster">
              </span>
            </div>
            <h1 class="home-main-title">Match</h1>
            <h2 class="home-sub-title">Monsters</h2>
            <p class="home-tagline">FLIP · MATCH · EARN</p>
          </div>

          <div class="container stats-container">
            <div class="row g-3 justify-content-center">
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <i class="fas fa-trophy stat-icon"></i>
                  <div class="stat-number" id="gamesPlayed">0</div>
                  <div class="stat-label">Games Played</div>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <i class="fas fa-clock stat-icon"></i>
                  <div class="stat-number" id="bestTime">--</div>
                  <div class="stat-label">Best Time</div>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <i class="fas fa-check-double stat-icon"></i>
                  <div class="stat-number" id="totalMatches">0</div>
                  <div class="stat-label">Total Matches</div>
                </div>
              </div>
              <div class="col-6 col-sm-3">
                <div class="stat-card">
                  <i class="fas fa-star stat-icon"></i>
                  <div class="stat-number" id="rewardsCount">0</div>
                  <div class="stat-label">Rewards</div>
                </div>
              </div>
            </div>
          </div>

          <a href="Subject.html" class="btn btn-start-game mt-3" id="chooseSubjectBtn">
            <i class="fas fa-book-open me-2"></i> Choose Subject
          </a>
        </div>

        <!-- GAME BOARD (hidden initially) -->
        <div id="homeGameScreen" class="home-game-screen" style="display: none;">
          <div class="game-header">
            <div class="game-title-sm">
              <i class="fas fa-dragon"></i> Match Monster
            </div>
            <div class="game-stats">
              <div class="stat-item">
                <i class="fas fa-exchange-alt"></i>
                Moves: <span class="stat-value" id="moveCount">0</span>
              </div>
              <div class="stat-item">
                <i class="fas fa-check-circle"></i>
                Matches: <span class="stat-value" id="matchCount">0</span>
                <span style="color: rgba(196,181,253,0.3);">/ 8</span>
              </div>
              <div class="stat-item">
                <i class="fas fa-clock"></i>
                <span class="stat-value" id="timerDisplay">0s</span>
              </div>
              <button class="btn-back-home" id="btnQuitGame">
                <i class="fas fa-home me-1"></i> Quit
              </button>
            </div>
          </div>
          <div class="card-grid" id="cardGrid"></div>
        </div>

        <!-- WIN OVERLAY -->
        <div id="winOverlay">
          <div class="win-box">
            <div class="win-icon">🏆</div>
            <h2>You matched them all!</h2>
            <p>Monsters are impressed by your memory!</p>
            <div class="win-stats">
              <div>
                <div class="num" id="winMoves">0</div>
                <div class="label">Moves</div>
              </div>
              <div>
                <div class="num" id="winTime">0s</div>
                <div class="label">Time</div>
              </div>
              <div>
                <div class="num">⭐</div>
                <div class="label">Reward</div>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;">
              <button class="btn-win-play" id="btnWinReplay">
                <i class="fas fa-redo me-2"></i> Play Again
              </button>
              <button class="btn-win-home" id="btnWinHome">
                <i class="fas fa-home me-2"></i> Home
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/navbar-loader.js"></script>
  <script src="script/script.js"></script>
  <script src="script/cloud-loader.js"></script>
  <script src="script/clouds.js"></script>
</body>
</html>
