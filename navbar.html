<!-- Navigation Bar -->
<nav class="navbar-custom">
  <div class="nav-left">
    <span class="game-title-nav">Match Monster</span>
  </div>
  <div class="nav-right">
    <!-- Inbox Button -->
    <button class="btn btn-icon" data-bs-toggle="modal" data-bs-target="#inboxModal">
      <i class="fas fa-inbox"></i>
      <span class="badge bg-danger badge-notif">3</span>
    </button>
    <!-- Settings Button -->
    <button class="btn btn-icon" data-bs-toggle="modal" data-bs-target="#settingsModal">
      <i class="fas fa-cog"></i>
    </button>
  </div>
</nav>

<!-- INBOX MODAL                                                  -->
<div class="modal fade" id="inboxModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-inbox me-2"></i>Inbox</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <ul class="list-group inbox-list">
          <li class="list-group-item">
            <i class="fas fa-star text-warning me-2"></i>
            <span><strong>Welcome!</strong> Start your monster matching adventure!</span>
          </li>
          <li class="list-group-item">
            <i class="fas fa-coins text-warning me-2"></i>
            <span><strong>Reward!</strong> You earned 50 coins for your first match.</span>
          </li>
          <li class="list-group-item">
            <i class="fas fa-unlock text-warning me-2"></i>
            <span><strong>New Monster!</strong> You unlocked the <strong>Dragon</strong> skin.</span>
          </li>
          <li class="list-group-item">
            <i class="fas fa-gem text-warning me-2"></i>
            <span><strong>Daily Bonus</strong> Log in tomorrow for a free reward.</span>
          </li>
        </ul>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL                                               -->
<div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="fas fa-cog me-2"></i>Settings</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body settings-body">
        <!-- Sound Effects -->
        <div class="settings-item">
          <span><i class="fas fa-volume-up me-2"></i>Sound Effects</span>
          <div class="form-check form-switch">
            <input class="form-check-input settings-toggle" type="checkbox" id="soundToggle" data-key="soundEnabled" checked>
          </div>
        </div>
        <!-- Background Music -->
        <div class="settings-item">
          <span><i class="fas fa-music me-2"></i>Background Music</span>
          <div class="form-check form-switch">
            <input class="form-check-input settings-toggle" type="checkbox" id="musicToggle" data-key="musicEnabled" checked>
          </div>
        </div>
        <!-- Dark Mode -->
        <div class="settings-item">
          <span><i class="fas fa-palette me-2"></i>Dark Mode</span>
          <div class="form-check form-switch">
            <input class="form-check-input settings-toggle" type="checkbox" id="darkModeToggle" data-key="darkMode">
          </div>
        </div>
        <!-- Difficulty -->
        <div class="settings-item">
          <span><i class="fas fa-dragon me-2"></i>Difficulty</span>
          <select class="form-select form-select-sm settings-select" id="difficultySelect" style="width: auto; background: transparent; color: #fff; border-color: rgba(139,92,246,0.3);">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <hr style="border-color: rgba(139,92,246,0.2);">
        <button class="btn btn-danger btn-sm w-100" id="resetProgressBtn">
          <i class="fas fa-trash-alt me-2"></i> Reset Progress
        </button>
      </div>
    </div>
  </div>
</div>
