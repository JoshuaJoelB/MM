<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon"  href="Assets/top_icon.png">
</head>
<body>

  <div id="loadingPage" class="page">
    <div class="loading-bg">
      <div class="loading-overlay">
        <div class="loading-box text-center">
          <div class="spinner-border text-warning" style="width: 4rem; height: 4rem;" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <h2 class="loading-title mt-4">Loading</h2>
          <div class="loading-dots">
            <span></span><span></span><span></span>
          </div>
          <p class="loading-sub mt-3">preparing monsters …</p>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
