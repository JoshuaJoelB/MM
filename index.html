<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a1428" />
  <title>Match Monster</title>

  <link rel="icon" href="Assets/top_icon.png" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style/style.css" />
</head>
<body>

  <div id="indexPage" class="page active-page">
    <div class="index-content">

      <!-- Big logo above the bar -->
      <div class="index-logo-wrapper">
        <div class="index-logo-ring"></div>
        <img src="Assets/top_icon.png"
             alt="Match Monster"
             class="index-logo-img"
             id="mainLogo" />
      </div>

      <!-- Loading bar with logo riding on it -->
      <div class="loading-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="loadingBarWrap">
        <div class="loading-bar-track">
          <div class="loading-bar-fill" id="loadingBarFill"></div>
        </div>
        <img src="Assets/Logo.png"
             alt=""
             class="loading-bar-logo"
             id="loadingBarLogo"
             draggable="false" />
      </div>

    </div>
  </div>

  <!-- ============================================================ -->
  <!-- Scripts                                                       -->
  <!-- ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Player level + points (must come before navbar-loader) -->
  <script src="script/player-level.js"></script>

  <!-- Clouds + island -->
  <script src="script/cloud-loader.js"></script>
  <script src="script/clouds.js"></script>
  <script src="script/island.js"></script>

  <!-- Shared logic (loading bar + redirect) -->
  <script src="script/script.js"></script>

</body>
</html>
