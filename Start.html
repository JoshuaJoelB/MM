<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Monster</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style/style.css" />
  <link rel="icon"  href="Assets/top_icon.png">
</head>
<body>

  <div id="startPage" class="page">
    <div class="start-bg">
      <div class="start-overlay">
        <div class="container h-100 d-flex align-items-center justify-content-center">
          <div class="start-carousel-wrapper">
            <div id="startCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel" data-bs-interval="4000">
              <div class="carousel-inner">
                <!-- Slide 1 -->
                <div class="carousel-item active">
                  <div class="carousel-content text-center">
                    <span class="carousel-icon">👋</span>
                    <h2 class="carousel-title">WELCOME TO</h2>
                    <h1 class="carousel-main">MATCH MONSTERS</h1>
                    <p class="carousel-sub">a memory adventure</p>
                  </div>
                </div>
                <!-- Slide 2 -->
                <div class="carousel-item">
                  <div class="carousel-content text-center">
                    <span class="carousel-icon">🧠</span>
                    <h2 class="carousel-title">Match, Remember,</h2>
                    <h1 class="carousel-main">Learn</h1>
                    <p class="carousel-sub">flip &amp; match the pairs</p>
                  </div>
                </div>
            
                <!-- Slide 3 -->
                <div class="carousel-item">
                  <div class="carousel-content text-center">
                    <span class="carousel-icon">🏆</span>
                    <h2 class="carousel-title">Play and</h2>
                    <h1 class="carousel-main">Earn Rewards</h1>
                    <p class="carousel-sub">every match counts</p>
                    <button class="btn btn-lets-start mt-4" id="letsStartBtn">
                      Let's Start <i class="fas fa-rocket ms-2"></i>
                    </button>
                  </div>
                </div>
              </div>
              <div class="carousel-indicators">
                <button type="button" data-bs-target="#startCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#startCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#startCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script/script.js"></script>
</body>
</html>
